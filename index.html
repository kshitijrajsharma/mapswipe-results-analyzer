<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MapSwipe Results Analyzer</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <aside id="sidebar">
    <header id="brand">
      <img class="logo" src="https://mapswipe.org/ms-logo.png" alt="MapSwipe" />
      <div>
        <h1>Results Analyzer</h1>
        <p>Map crowd-validated results and export features</p>
      </div>
      <button id="panel-toggle" aria-label="Toggle panel">&#9776;</button>
    </header>

    <section class="panel">
      <label for="project-input">Add project (URL or ID)</label>
      <div class="row">
        <input id="project-input" type="text"
               placeholder="https://mapswipe.org/en/projects/01KW8..." />
        <button id="add-button">Add</button>
      </div>
      <p id="status" class="status"></p>
    </section>

    <section class="panel">
      <label for="threshold">Accept when more than
        <strong id="threshold-value">50%</strong> of mappers said yes</label>
      <input id="threshold" type="range" min="0" max="100" value="50" />

      <p class="hint">More than the threshold said yes &rarr; Accepted. More than it said no &rarr; Rejected.
        Neither &rarr; Unclear.</p>

      <label for="opacity" class="spaced">See-through grid:
        <strong id="opacity-value">35%</strong></label>
      <input id="opacity" type="range" min="0" max="100" value="35" />
      <p class="hint">Lower it to see the satellite imagery through the colored areas.</p>

      <div class="show-filter">Layers:
        <label><input type="checkbox" id="layer-imagery"> imagery</label>
        <label><input type="checkbox" id="layer-aoi" checked> AOI</label>
        <label><input type="checkbox" id="show-accepted" checked> <span class="sw accepted"></span> accepted</label>
        <label><input type="checkbox" id="show-rejected" checked> <span class="sw rejected"></span> rejected</label>
        <label><input type="checkbox" id="show-unclear" checked> <span class="sw unclear"></span> unclear</label>
      </div>
    </section>

    <section class="panel">
      <div class="row spread">
        <h2>Projects</h2>
        <span class="header-actions">
          <button id="export-all" class="link" disabled>Export all</button>
          <button id="export-accepted" class="link" disabled>Export accepted</button>
        </span>
      </div>
      <div id="projects"></div>
    </section>
  </aside>

  <main id="map">
    <div id="legend">
      <div><span class="swatch accepted"></span> Accepted</div>
      <div><span class="swatch rejected"></span> Rejected</div>
      <div><span class="swatch unclear"></span> Unclear</div>
      <div><span class="swatch aoi"></span> Project area</div>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
